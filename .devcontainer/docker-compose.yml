services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:dev-24
    volumes:
      - ..:/workspaces/couch-companion-ui:cached
    command: sleep infinity
    networks:
      - ccui-net
    depends_on:
      couchdb:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  couchdb:
    image: couchdb:3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    volumes:
      - couchdb_data:/opt/couchdb/data
    ports:
      - "5984:5984"
    networks:
      - ccui-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5984/_up || exit 1"]
      interval: 5s
      retries: 20
      timeout: 3s
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command: start-dev --import-realm
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
      - keycloak_data:/opt/keycloak/data/
    ports:
      - "8080:8080"
    networks:
      - ccui-net
    healthcheck:
      test: [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET
          /realms/couch/.well-known/openid-configuration HTTP/1.1\\r\\nHost:
          localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep
          -q 'jwks_uri'",
        ]
      interval: 10s
      retries: 30
      timeout: 5s
      start_period: 90s
    restart: unless-stopped

networks:
  ccui-net:
    driver: bridge

volumes:
  couchdb_data:
  keycloak_data:
