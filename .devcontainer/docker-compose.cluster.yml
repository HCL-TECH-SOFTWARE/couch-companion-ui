# A three-node CouchDB cluster for development (#123).
#
# ADDITIVE. `devcontainer.json` never references this file, so the single-node
# stack in docker-compose.yml stays the default for everyday work and the two
# can run side by side: this one publishes 15984/25984/35984 and its own
# network, and `name:` below gives it a separate compose project.
#
# Do not bring it up by hand — use `scripts/cluster-up.sh`, which knows the two
# traps (`up --wait` exit codes, and the fact that the nodes have to be joined
# after they boot). Tear down with `scripts/cluster-up.sh down`, NOT with
# `docker compose stop`; see the tmpfs note below.

name: ccui-cluster

x-couch-common: &couch-common
  image: couchdb:3
  restart: unless-stopped
  # tmpfs: every node's data lives in RAM. No named volumes, nothing on disk,
  # and nothing to collide with the single-node stack's `couchdb_data`.
  #
  # The cost: `docker compose stop && start` HALF-DESTROYS the cluster. tmpfs
  # comes back empty while the .ini files in the writable layer survive, so the
  # node still reports `cluster_enabled` having lost its shard map, and
  # `_membership` collapses to one node. `cluster-up.sh` repairs that, but the
  # supported cycle is `down` then up.
  tmpfs:
    - /opt/couchdb/data
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:5984/_up || exit 1"]
    interval: 5s
    retries: 30
    timeout: 3s
    start_period: 10s

# COUCHDB_SECRET and COUCHDB_ERLANG_COOKIE must be IDENTICAL on all three: the
# cookie is what lets the Erlang nodes talk to each other at all, and the secret
# is what makes a session cookie issued by one node valid at the next.
x-couch-env: &couch-env
  COUCHDB_USER: admin
  COUCHDB_PASSWORD: password
  COUCHDB_SECRET: ccui-dev-cluster-secret
  COUCHDB_ERLANG_COOKIE: ccui-dev-cluster-cookie

services:
  # NODENAME MUST CONTAIN A DOT. The image's entrypoint turns it into
  # `-name couchdb@$NODENAME` in vm.args, and an Erlang long name needs an
  # FQDN-ish host — a bare `couchdb1` does not boot. It is supplied as both
  # `hostname:` and a network alias so the peers can resolve each other.
  #
  # Erlang distribution (9100, pinned min=max by the stock vm.args) and epmd
  # (4369) stay inside this network; neither is published.
  couchdb1:
    <<: *couch-common
    hostname: couchdb1.ccui.local
    environment:
      <<: *couch-env
      NODENAME: couchdb1.ccui.local
    ports:
      - "15984:5984"
    networks:
      ccui-cluster-net:
        aliases: [couchdb1.ccui.local]

  couchdb2:
    <<: *couch-common
    hostname: couchdb2.ccui.local
    environment:
      <<: *couch-env
      NODENAME: couchdb2.ccui.local
    ports:
      - "25984:5984"
    networks:
      ccui-cluster-net:
        aliases: [couchdb2.ccui.local]

  couchdb3:
    <<: *couch-common
    hostname: couchdb3.ccui.local
    environment:
      <<: *couch-env
      NODENAME: couchdb3.ccui.local
    ports:
      - "35984:5984"
    networks:
      ccui-cluster-net:
        aliases: [couchdb3.ccui.local]

  # One-shot: joins the three nodes into a cluster, then exits. It reuses the
  # couchdb image purely because that image already ships bash and curl.
  cluster-setup:
    image: couchdb:3
    depends_on:
      couchdb1: {condition: service_healthy}
      couchdb2: {condition: service_healthy}
      couchdb3: {condition: service_healthy}
    entrypoint: ["/bin/bash", "/setup/cluster-setup.sh"]
    volumes:
      - ../scripts/cluster-setup.sh:/setup/cluster-setup.sh:ro
    networks:
      - ccui-cluster-net
    restart: "no"

networks:
  ccui-cluster-net:
    driver: bridge
