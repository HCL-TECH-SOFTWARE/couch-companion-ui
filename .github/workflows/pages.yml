# Deploys dist/ to GitHub Pages. Runs ONLY on github.com (guarded per job) —
# on GHE both jobs skip; the workflow resumes working after the repo moves back.
#
# Released versions only, and only after release.yml has finished (#155). It used
# to deploy every push to main, which published whatever was on the branch rather
# than what was last released.
#
# `workflow_run` and not the `release` event, for two reasons. It is what actually
# orders the two: this cannot start until release.yml has finished pushing the
# version bump, so the deployed site carries the version that was just released.
# And release.yml publishes with GITHUB_TOKEN, which deliberately does not start
# workflow runs from the repository events it raises — a `release: published`
# trigger here would simply never fire. workflow_run is not suppressed that way.
name: Pages

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    # A failed release must not deploy: `types: [completed]` includes failure and
    # cancellation, and the conclusion is the only thing that separates them.
    if: >-
      github.server_url == 'https://github.com' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Explicitly main, which is where release.yml just pushed the bump —
          # and not `workflow_run.head_sha`, which is the commit release.yml
          # STARTED from, one commit before the version it released.
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.server_url == 'https://github.com'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
